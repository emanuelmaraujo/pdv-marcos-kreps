name: rapido
description: Mudança pequena de baixo risco; teste local e no máximo uma correção.
steps:
  - id: implement
    prompt: >-
      {{task}}


      Altere somente o necessário para o objetivo e preserve trabalho existente. Não altere
      pagamentos, auth, migrations, dados reais ou produção. Se a tarefa depender dessas áreas, pare
      e peça aprovação humana antes de alterar. Não faça merge, deploy nem chamadas a serviços
      reais. Rode somente o teste da área afetada; o check seguinte executará o gate unitário do
      projeto.
  - id: check
    command: npm test
    onFail:
      retry: implement
      max: 1
