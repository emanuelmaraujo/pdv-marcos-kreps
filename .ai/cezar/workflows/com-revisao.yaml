version: 2
name: com-revisao
description: Implementação, testes e revisão com até duas correções em cada loop; aprovação humana explícita.
nodes:
  - id: start
    type: start
  - id: implement
    type: agent
    name: Implementar
    prompt: >-
      {{task}}


      Altere somente o necessário para o objetivo e preserve trabalho existente. Não altere
      pagamentos, auth, migrations, dados reais ou produção. Se a tarefa depender dessas áreas, pare
      e peça aprovação humana antes de alterar. Não faça merge, deploy nem chamadas a serviços
      reais. Rode os testes da área afetada. Ao terminar, informe o resumo do diff (arquivos e
      mudanças), riscos, comandos de teste e resultados reais, incluindo o que não foi executado.
  - id: tests
    type: check
    name: Testes locais
    command: npm test
  - id: test-retry
    type: loop
    name: Correções de teste
    max: 2
  - id: fix
    type: agent
    name: Corrigir testes
    session:
      continue: implement
    prompt: >-
      Os testes falharam:

      {{nodes.tests.output}}


      Corrija a causa, sem remover testes ou relaxar critérios. Altere somente o necessário para o
      objetivo e preserve trabalho existente. Não altere pagamentos, auth, migrations, dados reais
      ou produção. Se a tarefa depender dessas áreas, pare e peça aprovação humana antes de alterar.
      Não faça merge, deploy nem chamadas a serviços reais. Ao terminar, informe o resumo do diff
      (arquivos e mudanças), riscos, comandos de teste e resultados reais, incluindo o que não foi
      executado.
  - id: review
    type: agent
    name: Revisar segurança, negócio e escopo
    verdicts:
      - approve
      - changes
    prompt: "Revise o diff atual para a tarefa: {{task}}. Foque em segurança, regra de negócio e escopo;
      indique apenas problemas concretos com arquivo e linha. Verifique os testes e a preservação
      das áreas sensíveis. Não altere arquivos. Ao terminar, informe o resumo do diff (arquivos e
      mudanças), riscos, comandos de teste e resultados reais, incluindo o que não foi executado.
      Termine com CEZ:VERDICT approve se não houver problemas; caso contrário, CEZ:VERDICT changes."
  - id: review-retry
    type: loop
    name: Rodadas de revisão
    max: 2
  - id: address
    type: agent
    name: Atender revisão
    session:
      continue: implement
    prompt: >-
      A revisão pediu mudanças:

      {{nodes.review.summary}}


      Atenda aos pontos dentro do escopo. Altere somente o necessário para o objetivo e preserve
      trabalho existente. Não altere pagamentos, auth, migrations, dados reais ou produção. Se a
      tarefa depender dessas áreas, pare e peça aprovação humana antes de alterar. Não faça merge,
      deploy nem chamadas a serviços reais. Ao terminar, informe o resumo do diff (arquivos e
      mudanças), riscos, comandos de teste e resultados reais, incluindo o que não foi executado.
  - id: approval
    type: ask-user
    name: Sua aprovação
    question: >-
      Aprova concluir esta tarefa? Somente a opção Aprovar autoriza o sucesso. Isto não autoriza
      merge, deploy ou operação em produção. Se a revisão ainda pediu mudanças após duas rodadas,
      examine as pendências antes de aprovar.


      Diff e riscos da implementação:

      {{nodes.implement.summary}}

      Correções de testes:

      {{nodes.fix.summary}}

      Correções da revisão:

      {{nodes.address.summary}}

      Revisão final ({{nodes.review.verdict}}):

      {{nodes.review.summary}}

      Testes finais (exit {{nodes.tests.exitCode}}):

      {{nodes.tests.output}}
    options:
      - Aprovar
      - Rejeitar
  - id: approved
    type: if
    condition:
      kind: output
      ref: approval.answer
      op: equals
      value: Aprovar
  - id: done
    type: end
    name: Concluído com aprovação
    status: success
  - id: stopped
    type: end
    name: Interrompido
    status: failed
edges:
  - from: start
    to: implement
  - from: implement.done
    to: tests
  - from: tests.pass
    to: review
  - from: tests.fail
    to: test-retry
  - from: test-retry.repeat
    to: fix
  - from: test-retry.exhausted
    to: stopped
  - from: fix.done
    to: tests
  - from: review.approve
    to: approval
  - from: review.changes
    to: review-retry
  - from: review-retry.repeat
    to: address
  - from: review-retry.exhausted
    to: approval
  - from: address.done
    to: tests
  - from: approval.answered
    to: approved
  - from: approved.true
    to: done
  - from: approved.false
    to: stopped
