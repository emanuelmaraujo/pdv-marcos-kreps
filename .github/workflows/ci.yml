name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            print-worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix print-worker
      - run: npm run check
      - run: npm run typecheck --prefix print-worker
      - run: npm run build --prefix print-worker
      - name: Build frontend without external services
        run: npm run build
        env:
          # Apenas compilação/prerender: não autenticam nem acessam produção.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-only-not-a-real-key

  database:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Replay migrations and run SQL tests on disposable database
        run: npm run test:database
