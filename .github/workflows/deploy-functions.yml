name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "scripts/check-supabase.mjs"
      - "scripts/validate-supabase-target.mjs"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
      EXPECTED_PROJECT_REF: feotsdzkwbikmcnzgsnh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Mesma CLI do lockfile, usada no replay e nos testes locais/CI.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.114.0
      - name: Validate target and required secrets
        run: node scripts/validate-supabase-target.mjs
      - name: Preview pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run
      - name: Apply pending migrations
        # include-all também contempla migrations versionadas anteriores à última
        # versão remota. Não repara, apaga ou marca histórico automaticamente.
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
      - name: Deploy all versioned Edge Functions
        # verify_jwt vem de config.toml; nenhuma lista manual pode omitir funções.
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --yes
      - name: Record deployed revision
        run: echo "Supabase atualizado a partir de $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
